<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PreFlight Live Demo</title>
  <meta name="description" content="Upload a CSV and watch pypreflight clean it, entirely in your browser.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PreFlight</h1>
    <p>Upload a CSV and see what <code>pypreflight</code> does to it. Everything runs in your
      browser; your file is never uploaded anywhere.</p>
    <p class="links">
      <a href="https://pypi.org/project/pypreflight/">PyPI</a> ·
      <a href="https://github.com/VAIyerAmogha/PreFlight">GitHub</a>
    </p>
  </header>

  <main>
    <section id="loader" aria-live="polite">
      <p id="load-status">Loading Python runtime…</p>
      <progress id="load-progress" max="4" value="0"></progress>
    </section>

    <section id="step-upload" hidden>
      <h2>1. Upload</h2>
      <input type="file" id="csv-file" accept=".csv,.tsv,.txt,text/csv">
      <label>Target column
        <select id="target" disabled><option value="">Choose a file first</option></select>
      </label>
      <button id="btn-analyze" disabled>Analyze</button>
      <p class="hint">Or try a sample: <button id="btn-sample" class="linklike">UCI automobile (dirty)</button></p>
    </section>

    <section id="step-plan" hidden>
      <h2>2. Plan</h2>
      <p id="plan-summary"></p>
      <div id="raw-preview" class="table-wrap"></div>
      <h3>Decisions</h3>
      <div id="decisions" class="table-wrap"></div>
      <h3>Open questions</h3>
      <form id="questions"></form>
      <button id="btn-run">Run prepare()</button>
    </section>

    <section id="step-result" hidden>
      <h2>3. Result</h2>
      <div id="cleaned-preview" class="table-wrap"></div>
      <div id="downloads"></div>
    </section>

    <section id="error" hidden role="alert"></section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
