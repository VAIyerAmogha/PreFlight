[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypreflight"
version = "2.0.0.dev0"
description = "A pip-installable Python library that takes a raw pandas DataFrame and returns a cleaned DataFrame, a reusable sklearn Pipeline, and a structured Report — automatically."
readme = "README.md"
license = {text = "MIT License"}
authors = [
    {name = "VAIyerAmogha"}
]
keywords = [
    "machine-learning",
    "preprocessing",
    "pandas",
    "scikit-learn",
    "feature-engineering"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.9"

dependencies = [
    "scikit-learn",
    "pandas",
    "numpy",
    "scipy",
    "python-dateutil",
    "matplotlib",
    "typer",
    "joblib",
    "charset-normalizer",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pypdf>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/VAIyerAmogha/PreFlight"
Repository = "https://github.com/VAIyerAmogha/PreFlight"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]
