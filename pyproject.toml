[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypreflight"
version = "2.0.0.dev0"
description = "A pip-installable Python library that takes a raw pandas DataFrame and returns a cleaned DataFrame, a reusable sklearn Pipeline, and a structured Report — automatically."
readme = "README.md"
license = {text = "MIT License"}
authors = [
    {name = "VAIyerAmogha"}
]
keywords = [
    "machine-learning",
    "preprocessing",
    "pandas",
    "scikit-learn",
    "feature-engineering"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.9"

dependencies = [
    "scikit-learn",
    "pandas",
    "numpy",
    "scipy",
    "python-dateutil",
    "matplotlib",
    "typer",
    "joblib",
    "charset-normalizer",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
# rich: MIT licence. Formatting only; the terminal channel works without it.
interactive = ["rich>=13"]
# ipywidgets: BSD-3-Clause licence. Needed only for the notebook channel.
notebook = ["ipywidgets>=8"]
dev = [
    "pytest",
    "pypdf>=5.0.0",
    # hypothesis: MPL-2.0 licence. Property-based/fuzz testing for the hardening suite.
    "hypothesis",
    # pytest-cov: MIT licence. Coverage reporting integration for pytest.
    "pytest-cov",
    # ruff: MIT licence. Linter/formatter.
    "ruff",
    # mypy: MIT licence. Static type checker.
    "mypy",
    # nox: Apache-2.0 licence. Test/lint session automation across interpreters.
    "nox",
    # pre-commit: MIT licence. Git hook manager for running lint/type checks pre-commit.
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/VAIyerAmogha/PreFlight"
Repository = "https://github.com/VAIyerAmogha/PreFlight"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["preflight"]

[tool.mypy]
# Note: mypy itself requires python_version >= 3.10 to check against, even though
# this project targets >=3.9 (requires-python). Pinned to the lowest mypy-supported
# floor; language-version-specific issues below 3.10 are not caught by this config.
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "preflight.*"
strict = true
